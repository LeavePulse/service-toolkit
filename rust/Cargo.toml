[package]
name = "service-toolkit-rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "service_toolkit_rust"
# cdylib: PyO3 extension module built by maturin for the 3 Python consumers.
# rlib:   plain Rust linkage for Rust consumers (e.g. server-poller).
crate-type = ["cdylib", "rlib"]

[features]
# Default build serves the existing Python extension (motd/segments/scoring/
# text/import_resolve), keeping the 3 Python consumers working.
default = ["python"]
# pyo3 bindings without the extension-module link flag, so the crate still
# builds as a plain rlib / for `cargo test`. Pulls in toml/serde_json for the
# Python CI gate builder (pyproject parsing + secret-baseline evaluation).
python = ["dep:pyo3", "dep:toml", "dep:serde_json"]
# maturin layers this on top of `python` to produce the importable .so.
extension-module = ["pyo3/extension-module"]
# gRPC client helpers for Rust consumers (no Python dependency).
grpc = ["dep:tonic", "dep:prost", "dep:tonic-types"]
# Runtime helpers for Rust services: env-config parsing, tracing init, a
# Prometheus /metrics server, a typed subprocess runner, wall-clock helpers.
runtime = [
    "dep:tokio",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:prometheus",
    "dep:tracing",
    "dep:tracing-subscriber",
]
# HTTP client side of the Transfer layer: declared policy, zstd/br/gzip
# decoding, retries with Retry-After, conditional GET over an ETag store.
# Portable (no unix-only code), so desktop and mobile consumers can take it.
http = ["dep:reqwest", "dep:bytes", "dep:httpdate", "dep:tokio", "tokio/time"]
# Atomic file replacement (sibling + fsync + rename + directory fsync, private
# and executable modes, write-if-changed) and JSON state load/save. Portable.
fs = ["dep:serde", "dep:serde_json"]
# SHA-1/SHA-256/SHA-512 as hex, one-shot, streaming and over files. Portable.
digest = ["dep:sha1", "dep:sha2"]
# Streamed downloads that land atomically only on a digest match, over the
# `http` client. Portable.
download = ["http", "fs", "digest", "tokio/fs", "tokio/io-util", "tokio/rt"]
# flock-based named locks and a process singleton. Unix only: on other targets
# the feature compiles to nothing.
lock = ["dep:libc"]
# Native `lp-ci` binary for Rust repos. No extra deps — the CI engine is pure
# std — so this builds standalone with `--no-default-features --features cli`.
cli = []

[dependencies]
regex = "1"
unicode-normalization = "0.1"
pyo3 = { version = "0.28", optional = true }
toml = { version = "0.8", optional = true }
serde_json = { version = "1", optional = true }
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }
tonic-types = { version = "0.12", optional = true }

# `runtime` feature deps. Versions match the consumer services (control-agent /
# server-poller) so the dependency graph stays unified.
tokio = { version = "1", features = ["rt", "net", "macros"], optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
prometheus = { version = "0.13", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# `http` feature deps. reqwest matches control-agent and the launcher (0.12,
# rustls, no default features).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "zstd"], optional = true }
bytes = { version = "1", optional = true }
httpdate = { version = "1", optional = true }

# `fs`, `digest` and `lock` feature deps. Versions match control-agent and the
# launcher.
serde = { version = "1", optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
libc = { version = "0.2", optional = true }

# Native CI gate for Rust consumers. Gated behind `cli` so the default
# (maturin/python) and grpc builds don't produce it.
[[bin]]
name = "lp-ci"
path = "src/bin/lp_ci.rs"
required-features = ["cli"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
